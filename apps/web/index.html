<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15803D" />
    <script>
      // Apply the theme before painting to avoid a flash (ADR-0008).
      try {
        var t = localStorage.getItem('reservas.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <style>
      /* Splash only. Colours match the design tokens (--bg, --primary, --primary-fg, --muted-fg). */
      html {
        --boot-bg: #f6faf7;
        --boot-card: #15803d;
        --boot-ink: #ffffff;
        --boot-text: #4b5e53;
      }
      html[data-theme='dark'] {
        --boot-bg: #0a1410;
        --boot-card: #4ade80;
        --boot-ink: #052e16;
        --boot-text: #9cb3a6;
      }
      body {
        margin: 0;
        background: var(--boot-bg);
      }
      .boot {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font:
          14px/1.4 system-ui,
          sans-serif;
        color: var(--boot-text);
      }
      .boot p {
        margin: 0;
      }
      .boot-card {
        fill: var(--boot-card);
      }
      .boot-track rect {
        fill: var(--boot-ink);
        fill-opacity: 0.28;
      }
      .boot-fill rect {
        fill: var(--boot-ink);
        transform-box: fill-box;
        transform-origin: left center;
        transform: scaleX(0);
        animation: boot-fill 1.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-fill {
        0% {
          transform: scaleX(0);
          opacity: 1;
        }
        32%,
        78% {
          transform: scaleX(1);
          opacity: 1;
        }
        100% {
          transform: scaleX(1);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-fill rect {
          animation: none;
          transform: scaleX(1);
        }
      }
    </style>
    <title>Salas · Reservas de salas</title>
  </head>
  <body>
    <div id="root">
      <!-- Splash while the bundle loads; React replaces it on mount. Self-contained: no app CSS is loaded yet. -->
      <div class="boot" role="status" aria-label="Cargando">
        <svg viewBox="0 0 32 32" aria-hidden="true" width="72" height="72">
          <rect width="32" height="32" rx="8" class="boot-card" />
          <g class="boot-track">
            <rect x="7" y="8" width="18" height="3.5" rx="1.75" />
            <rect x="7" y="14.25" width="18" height="3.5" rx="1.75" />
            <rect x="7" y="20.5" width="11" height="3.5" rx="1.75" />
          </g>
          <g class="boot-fill">
            <rect x="7" y="8" width="18" height="3.5" rx="1.75" style="animation-delay: 0s" />
            <rect x="7" y="14.25" width="18" height="3.5" rx="1.75" style="animation-delay: 0.22s" />
            <rect x="7" y="20.5" width="11" height="3.5" rx="1.75" style="animation-delay: 0.44s" />
          </g>
        </svg>
        <p>Cargando…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
